<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 14px system-ui, sans-serif; width: 340px; padding: 12px; color: #14213d; }
    label { display: block; font-size: 12px; margin-top: 8px; color: #555; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #ccd; border-radius: 4px; font: inherit; }
    button { margin-top: 12px; width: 100%; padding: 8px; border: 0; border-radius: 4px; background: #0e8a7d; color: #fff; font: inherit; cursor: pointer; }
    #status { margin-top: 8px; font-size: 12px; min-height: 16px; }
    details { margin-top: 10px; font-size: 12px; }
  </style>
</head>
<body>
  <strong>Save this job</strong>
  <label>Title<input id="title" /></label>
  <label>Company<input id="company" /></label>
  <label>Notes<textarea id="notes" rows="2"></textarea></label>
  <button id="save">Save to dashboard</button>
  <div id="status" role="status"></div>
  <details><summary>Settings</summary>
    <label>API address<input id="api" value="http://localhost:8000" /></label>
  </details>
  <script src="popup.js"></script>
</body>
</html>
